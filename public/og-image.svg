<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="g" x1="0" x2="1">
      <stop offset="0%" stop-color="#00FF7F" />
      <stop offset="100%" stop-color="#00BFFF" />
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="b" />
      <feMerge>
        <feMergeNode in="b" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="#020617"/>
  <g filter="url(#glow)">
    <circle cx="420" cy="315" r="200" fill="url(#g)" opacity="0.95" />
    <ellipse cx="420" cy="315" rx="260" ry="80" fill="none" stroke="#00FF7F" stroke-width="14" opacity="0.8"/>
  </g>
  <text x="650" y="320" font-family="Inter, Arial, sans-serif" font-size="80" fill="#00FF7F" font-weight="700">CREDIT</text>
  <text x="650" y="420" font-family="Inter, Arial, sans-serif" font-size="80" fill="#00BFFF" font-weight="700">SPHERE</text>
</svg>
